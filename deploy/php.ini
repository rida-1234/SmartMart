; Smart Mart portable PHP settings.
; Copy this file into C:\SmartMart\php\ next to php.exe (it replaces php.ini-production).

[PHP]
engine = On
short_open_tag = Off
memory_limit = 256M
max_execution_time = 120
post_max_size = 32M
upload_max_filesize = 32M
display_errors = Off
log_errors = On
expose_php = Off

extension_dir = "ext"
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip

zend_extension=opcache

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.validate_timestamps=1
opcache.revalidate_freq=60

[Date]
; Set to the shop's timezone, e.g. Asia/Dubai, Europe/London
date.timezone = UTC
